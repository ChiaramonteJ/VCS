<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>No-script checks</title></head><body><pre id="results">RUNNING</pre><iframe sandbox="allow-same-origin" title="Page with scripts disabled" style="width:375px;height:1000px;border:0"></iframe><script>
(async()=>{if(location.hostname!=="localhost")throw new Error("Local preview only");const frame=document.querySelector("iframe"),results=[];for(const path of ["/","/services/deep-clean/","/service-area/plainwell-mi/"]){await new Promise(r=>{frame.onload=r;frame.src=path});const d=frame.contentDocument,w=frame.contentWindow,failures=[];if(w.getComputedStyle(d.querySelector(".navbar-collapse")).display==="none")failures.push("navigation hidden");if(w.getComputedStyle(d.querySelector(".dropdown-menu")).display==="none")failures.push("service links hidden");if(d.documentElement.scrollWidth>376)failures.push("overflow");if(d.querySelector(".accordion-collapse")&&w.getComputedStyle(d.querySelector(".accordion-collapse")).display==="none")failures.push("FAQs hidden");results.push({path,failures});}document.querySelector("#results").textContent=JSON.stringify({status:"DONE",results});frame.remove()})()
</script></body></html>
